
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Ventana Satélite</title>
</head>
<body>

    <h1>Ventana Satélite</h1>

    <p id="bienvenida">Detectando sistema operativo...</p>

    <button onclick="redirigirConHistorial()">
        Redirigir con Historial
    </button>

    <button onclick="redirigirSinHistorial()">
        Redirigir sin Historial
    </button>

    <script>

        const agente = navigator.userAgent;
        let sistema = "desconocido";

        if (agente.includes("Windows")) {
            sistema = "Windows";
        } else if (agente.includes("Mac")) {
            sistema = "Mac";
        } else if (agente.includes("Linux")) {
            sistema = "Linux";
        }

        document.getElementById("bienvenida").textContent ="¡Bienvenido! Estás utilizando " + sistema;

        
        function redirigirConHistorial() {
            window.opener.location.assign("https://www.ilerna.es");
        }

        function redirigirSinHistorial() {
            window.opener.location.replace("https://www.ilerna.es/");
        }

        function autodestruir() {
            // Tiempo inicial
            let segundos = 5;
            // Mostramos el primer mensaje
            document.getElementById("cuentaAtras").textContent ="La ventana se cerrará en " + segundos + " segundos...";

            // Ejecutamos la cuenta atrás cada segundo
            const intervalo = setInterval(function() {
                segundos--;
                if (segundos > 0) {
                    document.getElementById("cuentaAtras").textContent = "La ventana se cerrará en " + segundos + " segundos...";
                } else {
                    clearInterval(intervalo);
                    window.close();
                }
            }, 1000);
        }


    </script>

    
    <button onclick="autodestruir()">
        Autodestrucción en 5 segundos
    </button>

    <p id="cuentaAtras"></p>


</body>
</html>
